<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassa · New transfer</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #f4f6f8; color: #14202b; margin: 0; }
  main { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px #0001; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #4a5a68; margin-top: 14px; }
  input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border: 1px solid #c9d3dc; border-radius: 8px; }
  .fee { margin-top: 16px; padding: 12px; border-radius: 8px; background: #eef4fb; }
  button { margin-top: 18px; width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: #0b5cad; color: #fff; cursor: pointer; }
  #result { margin-top: 14px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>New transfer</h1>
  <label for="to">Recipient IBAN</label>
  <input id="to" value="FI5542345670000081">
  <label for="amount">Amount (EUR)</label>
  <input id="amount" inputmode="decimal" value="100.00">
  <label for="kind">Transfer type</label>
  <select id="kind">
    <option value="sepa">SEPA (1 banking day, free)</option>
    <option value="instant">Instant (0.2 %, min €0.50)</option>
  </select>
  <div class="fee">Fee: <strong id="fee">–</strong><br>Total debited: <strong id="total">–</strong></div>
  <button id="send">Send transfer</button>
  <div id="result" role="status"></div>
</main>
<script src="app.js"></script>
</body>
</html>
